<svg xmlns="http://www.w3.org/2000/svg" width="680" height="702" viewBox="0 0 680 702" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>Toronto Bike Share data pipeline</title>
  <desc>Raw trip files are cleaned into a trips table, split into hourly departures and arrivals, joined into station hourly demand, then combined with all hours and station windows to build a full station-hour grid and the final report table with quiet hours filled as zeros.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .box { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.75; }
      .title { font-size: 14px; font-weight: 600; fill: #085041; }
      .sub { font-size: 12px; fill: #0F6E56; }
      .arr { fill: none; stroke: #5F5E5A; stroke-width: 1.5; }
    </style>
  </defs>
  <rect x="0" y="0" width="680" height="702" fill="#FFFFFF"/>

  <rect class="box" x="220" y="30" width="240" height="56" rx="8"/>
  <text class="title" x="340" y="52" text-anchor="middle">Raw trip CSVs</text>
  <text class="sub" x="340" y="72" text-anchor="middle">2023 to 2026, Toronto Open Data</text>
  <line class="arr" x1="340" y1="86" x2="340" y2="124" marker-end="url(#arrow)"/>

  <rect class="box" x="220" y="126" width="240" height="56" rx="8"/>
  <text class="title" x="340" y="148" text-anchor="middle">trips</text>
  <text class="sub" x="340" y="168" text-anchor="middle">Cleaned, one row per trip</text>
  <path class="arr" d="M340 182 L340 200 L205 200 L205 220" marker-end="url(#arrow)"/>
  <path class="arr" d="M340 200 L475 200 L475 220" marker-end="url(#arrow)"/>

  <rect class="box" x="100" y="222" width="210" height="56" rx="8"/>
  <text class="title" x="205" y="244" text-anchor="middle">hourly_departures</text>
  <text class="sub" x="205" y="264" text-anchor="middle">Station × hour counts</text>
  <rect class="box" x="370" y="222" width="210" height="56" rx="8"/>
  <text class="title" x="475" y="244" text-anchor="middle">hourly_arrivals</text>
  <text class="sub" x="475" y="264" text-anchor="middle">Station × hour counts</text>
  <path class="arr" d="M205 278 L205 296 L340 296 L340 316" marker-end="url(#arrow)"/>
  <path class="arr" d="M475 278 L475 296 L340 296"/>

  <rect class="box" x="220" y="318" width="240" height="56" rx="8"/>
  <text class="title" x="340" y="340" text-anchor="middle">station_hourly_demand</text>
  <text class="sub" x="340" y="360" text-anchor="middle">Full outer join, 11.8M rows</text>
  <path class="arr" d="M340 374 L340 394 L205 394 L205 412" marker-end="url(#arrow)"/>
  <path class="arr" d="M340 394 L475 394 L475 412" marker-end="url(#arrow)"/>

  <rect class="box" x="100" y="414" width="210" height="56" rx="8"/>
  <text class="title" x="205" y="436" text-anchor="middle">all_hours</text>
  <text class="sub" x="205" y="456" text-anchor="middle">32,858 hours</text>
  <rect class="box" x="370" y="414" width="210" height="56" rx="8"/>
  <text class="title" x="475" y="436" text-anchor="middle">station_window</text>
  <text class="sub" x="475" y="456" text-anchor="middle">First and last hour, 1,169</text>
  <path class="arr" d="M205 470 L205 490 L340 490 L340 508" marker-end="url(#arrow)"/>
  <path class="arr" d="M475 470 L475 490 L340 490"/>

  <rect class="box" x="220" y="510" width="240" height="56" rx="8"/>
  <text class="title" x="340" y="532" text-anchor="middle">station_hour_grid</text>
  <text class="sub" x="340" y="552" text-anchor="middle">Every open hour, 28.5M rows</text>
  <line class="arr" x1="340" y1="566" x2="340" y2="604" marker-end="url(#arrow)"/>
  <path class="arr" d="M220 346 L60 346 L60 634 L218 634" marker-end="url(#arrow)"/>

  <rect class="box" x="220" y="606" width="240" height="56" rx="8"/>
  <text class="title" x="340" y="628" text-anchor="middle">station_hourly_report</text>
  <text class="sub" x="340" y="648" text-anchor="middle">Grid + counts, zeros filled</text>
</svg>
